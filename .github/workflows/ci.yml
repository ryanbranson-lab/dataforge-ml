name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check dataforge tests
      - run: ruff format --check dataforge tests
      - run: mypy
      - run: python -m unittest discover -s tests -v
      - run: python -m dataforge examples/manifest.jsonl --root examples/data
      - run: python -m dataforge.diff examples/manifest.jsonl examples/manifest.jsonl --before-root examples/data --after-root examples/data
      - name: Build and validate a temporary manifest
        run: |
          python - <<'PYCODE'
          import tempfile
          from pathlib import Path
          from dataforge.build import build_manifest
          from dataforge.manifest import validate
          with tempfile.TemporaryDirectory() as scratch:
              output = Path(scratch) / "manifest.jsonl"
              build_manifest("examples/data", split="train", license_declaration="MIT", output=output)
              assert validate(output, "examples/data")["ok"]
          PYCODE
      - run: python -m compileall -q dataforge

  image-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-images.txt
      - run: python -c "import PIL; assert PIL.__version__ == '13.0.0'"
      - run: python -m unittest discover -s tests -p test_images.py -v
