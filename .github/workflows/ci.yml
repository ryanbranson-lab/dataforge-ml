name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check dataforge tests
      - run: ruff format --check dataforge tests
      - run: mypy
      - run: python -m unittest discover -s tests -v
      - run: python -m dataforge examples/manifest.jsonl --root examples/data
      - run: python -m compileall -q dataforge
